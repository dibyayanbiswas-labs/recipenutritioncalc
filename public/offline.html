<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<title>You're offline — Recipe Nutrition Calculator</title>
		<style>
			:root {
				color-scheme: light dark;
				--canvas: #fafafa;
				--ink: #171717;
				--body: #4d4d4d;
				--hairline: #ebebeb;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--canvas: #0a0a0a;
					--ink: #ededed;
					--body: #b4b4b4;
					--hairline: #262626;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--canvas);
				color: var(--ink);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				padding: 24px;
			}
			.card {
				max-width: 420px;
				text-align: center;
			}
			svg {
				width: 40px;
				height: 40px;
				margin-bottom: 20px;
			}
			path {
				fill: var(--ink);
			}
			h1 {
				font-size: 22px;
				font-weight: 600;
				letter-spacing: -0.5px;
				margin: 0 0 8px;
			}
			p {
				font-size: 15px;
				line-height: 1.5;
				color: var(--body);
				margin: 0 0 24px;
			}
			button {
				appearance: none;
				border: 1px solid var(--hairline);
				background: transparent;
				color: var(--ink);
				font: inherit;
				font-weight: 500;
				font-size: 14px;
				padding: 10px 20px;
				border-radius: 100px;
				cursor: pointer;
			}
			button:hover {
				background: var(--hairline);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128" aria-hidden="true">
				<path
					d="M50.4 78.5a75.1 75.1 0 0 0-28.5 6.9l24.2-65.7c.7-2 1.9-3.2 3.4-3.2h29c1.5 0 2.7 1.2 3.4 3.2l24.2 65.7s-11.6-7-28.5-7L67 45.5c-.4-1.7-1.6-2.8-2.9-2.8-1.3 0-2.5 1.1-2.9 2.7L50.4 78.5Zm-1.1 28.2Zm-4.2-20.2c-2 6.6-.6 15.8 4.2 20.2a17.5 17.5 0 0 1 .2-.7 5.5 5.5 0 0 1 5.7-4.5c2.8.1 4.3 1.5 4.7 4.7.2 1.1.2 2.3.2 3.5v.4c0 2.7.7 5.2 2.2 7.4a13 13 0 0 0 5.7 4.9v-.3l-.2-.3c-1.8-5.6-.5-9.5 4.4-12.8l1.5-1a73 73 0 0 0 3.2-2.2 16 16 0 0 0 6.8-11.4c.3-2 .1-4-.6-6l-.8.6-1.6 1a37 37 0 0 1-22.4 2.7c-5-.7-9.7-2-13.2-6.2Z"
				/>
			</svg>
			<h1>You're offline</h1>
			<p>Can't reach Recipe Nutrition Calculator right now. Recipe analysis needs a connection — check yours and try again.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</div>
	</body>
</html>
